<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BENGOS">
  <!--
    Ikona BENGOS w wersji wektorowej.

    ── PO CO SVG, SKORO MANIFEST CHCE PNG ───────────────────────────────
    Manifest wskazywał trzy pliki PNG, których w repozytorium nie ma,
    a wgrywanie binariów nie idzie przez narzędzie, którym pracuję.
    SVG rozwiązuje oba problemy naraz: jest tekstem, więc da się je
    zapisać tak samo jak każdy plik kodu, a skaluje się bez utraty
    jakości — jedna ikona obsługuje wszystkie rozmiary.

    Manifest nadal wskazuje PNG-i, bo ich brak jest zgłoszony osobno,
    i NIE udaję, że to załatwia. Ta ikona jest dodatkową pozycją
    (`sizes: "any"`), więc przeglądarka, która obsługuje SVG, użyje jej,
    a która nie — sięgnie po PNG, gdy ktoś je doda.

    ── SKĄD BIORĄ SIĘ KOLORY ────────────────────────────────────────────
    Z palety ciemnego motywu BENGOS: tło `#0B0B0F` to `--bengos-surface`,
    a akcent `#7C5CFF` to `--bengos-accent`. Ikona nie może sięgać
    do zmiennych CSS (manifest i ekran startowy czytają ją bez arkusza),
    więc wartości są tu powtórzone jako stałe — i to jest jedyne miejsce
    w projekcie, w którym wolno to zrobić.

    Znakiem jest litera „B” w pierścieniu, nawiązującym do kuli z logo.
    Pełna grafika z tygrysem jest zbyt drobna, żeby cokolwiek znaczyła
    w rozmiarze 48 px na ekranie telefonu.
  -->
  <rect width="512" height="512" rx="112" fill="#0B0B0F"/>

  <circle cx="256" cy="256" r="168" fill="none" stroke="#7C5CFF" stroke-width="6" opacity="0.55"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#7C5CFF" stroke-width="2" opacity="0.25"/>

  <path
    d="M186 136h94c46 0 78 26 78 66 0 26-14 44-36 53 28 9 46 30 46 60 0 45-35 73-85 73h-97zM238 186v52h38c17 0 27-9 27-26s-10-26-27-26zm0 100v56h42c19 0 30-10 30-28s-11-28-30-28z"
    fill="#F5F5F7"
  />
</svg>
