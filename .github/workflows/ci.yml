name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uprawnienia tylko do odczytu kodu. CI nie potrzebuje prawa zapisu do
# repozytorium i nie powinno go mieć.
permissions:
  contents: read

jobs:
  web:
    name: Interfejs — typy i testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Zależności
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Kontrola typów
        run: npm run typecheck --workspaces --if-present

      - name: Testy
        run: npm run test --workspaces --if-present

      # Bramka dostępności: pary kolorów, które nie przechodzą AA, zatrzymują
      # scalenie. To test, nie raport — dlatego jest osobnym krokiem.
      - name: Kontrast WCAG 2.2 AA
        run: node --test packages/ui/src/contrast.test.ts
        env:
          NODE_OPTIONS: --experimental-strip-types

      - name: Budowanie
        run: npm run build
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000

  secret-scan:
    name: Skanowanie sekretów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Historia, nie tylko bieżący stan: sekret usunięty w kolejnym commicie
      # zostaje w historii i dalej jest sekretem.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
