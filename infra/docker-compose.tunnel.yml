# TIKBENGOS przez Cloudflare Tunnel — bez otwierania portów przychodzących.
#
# ── PO CO TEN PLIK ──────────────────────────────────────────────────────
# Wdrożenie na Oracle blokowało się na Security List: porty 80 i 443 trzeba
# otworzyć ręcznie w konsoli OCI, a to ustawienie po stronie sterowania
# Oracle, do którego instancja nie ma dostępu.
#
# Tunel omija ten problem u źródła. `cloudflared` otwiera połączenie
# WYCHODZĄCE z maszyny do Cloudflare i przekazuje tam ruch. Nic nie próbuje
# wejść z zewnątrz, więc reguły przychodzące nie są potrzebne — istniejąca
# reguła SSH wystarcza.
#
# Efekt uboczny, na którym najbardziej zależy: dostajesz HHTTPS. Bez domeny
# po HTTP logowanie nie działa, bo `SESSION_COOKIE_SECURE` każe przeglądarce
# wysyłać ciasteczko sesji tylko po HTTPS.
#
# ── JAK URUCHOMIĆ ───────────────────────────────────────────────────────
#    bash scripts/tunel.sh
#
# Skrypt sprawdza, że aplikacja działa lokalnie, podnosi tunel i wypisuje
# publiczny adres HTTPS, który Cloudflare przydzielił.
#
# ── CZEGO NIE ROBI ──────────────────────────────────────────────────────
# Nie wymaga konta Cloudflare ani domeny: tryb `--url` daje darmowy adres
# `*.trycloudflare.com`, ważny do restartu tunelu. Stały adres wymaga konta
# (patrz komentarz przy wolumenach na końcu).

name: tikbengos-tunnel

services:
  # Kontener z tunelem. Obraz oficjalny, wersja przypięta do linii 2026.
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    restart: unless-stopped
    # `--url` wskazuje usługę w sieci Dockera, tę samą, z której korzysta
    # Caddy. Dzięki temu tunel wchodzi do aplikacji tak samo jak proxy,
    # a nie obok niej — jeden punkt wejścia, nie dwa równoległe.
    #
    # `--no-autoupdate` jest celowe: obraz produkowany ma się nie zmieniać
    # bez decyzji człowieka. Kontener, który sam siebie aktualizuje,
    # utrudnia odtworzenie stanu, w którym coś działało.
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://proxy:80
    depends_on:
      - proxy
    # Tunel nie przyjmuje ruchu — sam go wychodzi. Porty są więc tylko
    # wewnątrz sieci Dockera i nie są nigdzie wystawiane.
    networks:
      - tunnel

  # Caddy zostaje bez zmian, ale w tym pliku nie wystawiamy jego portów
  # na świat. Tunel łączy się z nim po wewnętrznej nazwie `proxy`.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-certyfikat-nieaktywny@localhost}
    networks:
      - tunnel

networks:
  tunnel:
    # Sieć zewnętrzna, utworzona przy pierwszym wdrożeniu przez
    # `docker-compose.prod.yml`. Tunel musi dołączyć do TEJ SAMEJ sieci,
    # żeby widział usługę `proxy` — inaczej rozwiązanie nazwy zawiedzie
    # i tunel nie miałby dokąd przekazać ruchu.
    external: true
    name: tikbengos_default

volumes:
  # Wolumeny współdzielone z wdrożeniem podstawowym: Caddy trzyma tu
  # certyfikaty, a konfiguracja jest wspólna, żeby nie było dwóch
  # różnych reguł routingu.
  caddy-data:
    external: true
    name: tikbengos_caddy-data
  caddy-config:
    external: true
    name: tikbengos_caddy-config
