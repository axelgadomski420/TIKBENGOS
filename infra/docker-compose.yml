# Infrastruktura TIKBENGOS — środowisko developerskie
#
# Cały stos aplikacyjny: jedna maszyna, kilka kontenerów. Worker muzyczny NIE jest
# tu zdefiniowany celowo — wymaga karty graficznej z 16 GB pamięci i należy do
# osobnej usługi, nie do środowiska developerskiego.

name: tikbengos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tikbengos}
      POSTGRES_USER: ${POSTGRES_USER:-tikbengos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tikbengos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgres://${POSTGRES_USER:-tikbengos}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-tikbengos}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../services/api:/srv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    command: daphne -b 0.0.0.0 -p 8001 tikbengos.asgi:application
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
