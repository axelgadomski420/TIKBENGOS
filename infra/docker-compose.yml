# Infrastruktura TIKBENGOS — środowisko developerskie

name: tikbengos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tikbengos}
      POSTGRES_USER: ${POSTGRES_USER:-tikbengos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tikbengos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-worker:
    build:
      context: ..
      dockerfile: services/ai-worker/Dockerfile
    restart: unless-stopped
    environment:
      BENGOS_API_URL: http://api:8000
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:-dev-only-worker-token-change-me}
      PLUTER_API_BASE_URL: ${PLUTER_API_BASE_URL:-https://api.openai.com/v1}
      PLUTER_API_KEY: ${PLUTER_API_KEY:-}
      PLUTER_MODEL: ${PLUTER_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgres://${POSTGRES_USER:-tikbengos}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-tikbengos}
      REDIS_URL: redis://redis:6379/0
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:-dev-only-worker-token-change-me}
      ASSISTANT_LLM_ENDPOINT: http://ai-worker:8092/jobs
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    volumes:
      - ../services/api:/srv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    command: daphne -b 0.0.0.0 -p 8001 tikbengos.asgi:application
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
