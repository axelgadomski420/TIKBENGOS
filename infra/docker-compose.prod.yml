successfully downloaded text file (SHA: a135699e6edb125c2cfd959b1c436e6190b2d5d4)# Infrastruktura TIKBENGOS — środowisko produkcyjne.
#
# Pięć różnic wobec `docker-compose.yml`, każda jest celowa:
#
# 1. HASA WYMAGANE, NIE DOMYŚLNE. W pliku developerskim hasło bazy ma
#    domyślkę `change-me`. Tu nie ma żadnej: brak zmiennej w `.env`
#    zatrzymuje start z błędem. Domyślka na publicznej maszynie to baza
#    otwarta dla każdego, kto zgadnie port.
# 2. PORTY NA ZEWNĄTRZ ZAMKNIĘTE. Baza, Redis, API i worker agenta nie są
#    wystawione na świat — tylko reverse proxy (Caddy) ma porty 80 i 443.
#    Reszta rozmawia w sieci Dockera, gdzie nie dosięgnie jej nikt z zewnątrz.
# 3. SERWER PRODUKCYJNY, NIE DEVELOPERSKI. `runserver` i `daphne` są
#    zastąpione przez gunicorn (WSGI) i uvicorn (ASGI) z kilkoma procesami.
# 4. USŁUGA `web`. W pliku developerskim jej nie było, więc pod adresem
#    publicznym widać było samo API, a nie aplikację.
# 5. USŁUGA `code-worker`. Agent kodujący żyje w OSOBNYM kontenerze, w innej
#    sieci niż baza — powód jest w komentarzu przy samej usłudze i jest
#    bezpieczeństwem, nie wygodą.
#
# `infra/docker-compose.yml` zostaje bez zmian jako środowisko developerskie.

name: tikbengos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bez domyślnego hasła. `${VAR:?komunikat}` przerywa start, gdy brak.
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Ustaw REDIS_PASSWORD w .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    # Trzy procesy gunicorna. Maszyna darmowa ma dwa rdzenie Ampere,
    # więc więcej procesów nie przyspieszy niczego — będzie tylko kolejkować.
    #
    # `collectstatic` jest tu BEZ `|| true`. Poprzednia wersja tłumiła jego
    # wynik, więc brak aplikacji `django.contrib.staticfiles` w ustawieniach
    # przechodził niezauważony — komenda nie istniała, a deploy wyglądał
    # na udany. Teraz brak `staticfiles` zatrzymuje start głośno.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn tikbengos.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY w .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Ustaw FIELD_ENCRYPTION_KEY w .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Ustaw ALLOWED_HOSTS w .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Ustaw CSRF_TRUSTED_ORIGINS w .env}
      # ── Moduły i dostawcy ─────────────────────────────────────────────
      # Compose NIE wstrzykuje zmiennych z ".env" do kontenerów sam z siebie:
      # ".env" służy tylko do podstawień "${...}" w tym pliku. Zmienna, której
      # tu nie ma, w kontenerze API nie istnieje nawet wtedy, gdy leży w ".env"
      # na hoście — więc każda zmienna czytana przez settings.py musi tu jawnie
      # przejść. Wszystkie poniższe są opcjonalne, dokładnie tak samo jak
      # w ustawieniach: pusto = moduł uczciwie mówi "nie skonfigurowano".
      # OAuth (Google, GitHub): pusto = przyciski dostawców nieaktywne.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      # BENGOS Dev: token do GitHuba (plan + pull request) i adres executora.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BENGOS_CODE_EXECUTOR_URL: ${BENGOS_CODE_EXECUTOR_URL:-}
      # BENGOS Music: adres workera GPU i limit dzienny na użytkownika.
      # Limit używa ":-" (domyślna także przy pustym), bo pusty ciąg
      # trafiłby do int("") i zatrzymał import ustawień.
      MUSICGEN_ENDPOINT: ${MUSICGEN_ENDPOINT:-}
      MUSIC_DAILY_LIMIT: ${MUSIC_DAILY_LIMIT:-10}
      # Wspólny sekret endpointów zwrotnych /jobs/{id}/complete: worker GPU,
      # executor zmian, worker asystenta. Pusto = endpointy zwrotne zwracają
      # 403 dla każdego żądania.
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:-}
      # BENGOS Asystent: adres usługi z modelem i nazwa modelu.
      ASSISTANT_LLM_ENDPOINT: ${ASSISTANT_LLM_ENDPOINT:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    restart: unless-stopped
    command: uvicorn tikbengos.asgi:application --host 0.0.0.0 --port 8001 --workers 2
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* Next.js wypala w paczce klienta W CZASIE BUDOWY.
      # Podana tylko w "environment" (runtime) do przeglądarki nie trafia
      # — po wdrożeniu czat pokazywałby "nieskonfigurowany", choć ".env"
      # jest poprawny. Dlatego wartość idzie przez args do etapu builder.
      args:
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
    restart: unless-stopped
    environment:
      # Proxy w `apps/web` czyta ten adres po stronie serwera Next.js.
      # To adres w sieci Dockera, nie publiczny — ciasteczko sesji zostaje
      # w jednej domenie, więc CORS nie jest potrzebny.
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
      NODE_ENV: production
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Jedyne porty wystawione na świat.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Ustaw DOMAIN w .env}
      ACME_EMAIL: ${ACME_EMAIL:?Ustaw ACME_EMAIL w .env}
    depends_on:
      - web
      - api

  # ───────────────────────────────────────────────────────────────────────
  # AGENT KODUJĄCY — BENGOS Dev
  # ─────────────────────────────────────────────────────────────────────
  #
  # ── DLACZEGO OSOBNY KONTENER ───────────────────────────────────────────
  # Agent wykonuje polecenia powłoki. README TIKCODING mówi to wprost:
  # uruchamiaj wyłącznie w kontenerze, bo inaczej agent grzebie w systemie
  # plików hosta. Gdyby chodził w procesie Django, jedno jego polecenie
  # sięgałoby do bazy i do kluczy dostawców użytkowników.
  #
  # ── DLACZEGO W INNEJ SIECI NIŻ BAZA ────────────────────────────────────
  # Ten kontener NIE JEST w domyślnej sieci `tikbengos`. To nie ostrożność,
  # a warunek: agent, któremu model każe wysłać dane na zewnątrz, nie może
  # mieć trasy do bazy ani do Redisa. Do internetu wychodzi (musi — klonuje
  # repozytorium i woła model), ale do własnej infrastruktury nie.
  #
  # ── DLACZEGO `profiles` ────────────────────────────────────────────────
  # Usługa jest w profilu `worker`, więc NIE startuje przy zwykłym
  # `docker compose up -d`. Powód jest praktyczny: bez klucza modelu
  # i bez podłączonego agenta ten kontener nie ma czego robić, a kontener,
  # który stoi i nic nie robi, wygląda na zepsuty. Włącza się świadomie:
  #     docker compose --profile worker up -d code-worker
  #
  # ── CZEGO TU NIE MA I DLACZEGO ─────────────────────────────────────────
  # Bez `ports`: ten kontener nie ma portu. Woła go API, nie świat — a brak
  # portu to brak powierzchni ataku, której nie potrzebujemy.
  # Bez `DATABASE_URL` i bez `REDIS_URL`, przez co agent nie ma czym sięgnąć
  # po dane użytkowników, nawet gdyby model go o to poprosił.
  # Bez `GITHUB_READ_TOKEN` w domyślnym wariancie: klonowanie publicznych
  # repozytoriów wystarcza do planu, a token dodajesz świadomie w `.env`.
  code-worker:
    build:
      context: ..
      dockerfile: services/code-worker/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    environment:
      # Klucz modelu — po stronie serwera, nie użytkownika. Bez niego worker
      # odmawia startu z wyjaśnieniem, a nie pada w połowie zlecenia.
      # Puste znaczy „pominięty”: nie każdy używa Anthropica.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Potwierdzenie, że obraz z agentem jest podniesiony. Bez tego worker
      # zwraca `unavailable` Z WYJAŚNIENIEM — wołanie agenta, którego nie ma,
      # zwróciłoby „command not found”, czyli dokładnie tę atrapę, której
      # brief zakazuje.
      CODE_AGENT_AVAILABLE: ${CODE_AGENT_AVAILABLE:-0}
      # Token tylko do CZYTANIA prywatnych repozytoriów. Zapis (gałąź, commit,
      # pull request) robi API, gdzie jest token użytkownika i dziennik audytu.
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-}
      CODE_WORK_DIR: /srv/work
    volumes:
      # Katalog pracy na wolumenie, nie w warstwie obrazu: klony repozytoriów
      # są duże, a obraz ma zostać mały. `:rw` jest konieczne — worker pisze.
      - code-worker-work:/srv/work
    networks:
      # Własna sieć z wyjściem na świat i BEZ trasy do bazy oraz Redisa.
      # `internal: false` znaczy, że internet działa (klonowanie, model),
      # a brak wpisu o sieci domyślnej odcina drogę do reszty stosu.
      - code-worker-net

networks:
  code-worker-net:
    driver: bridge
    # Nie `internal: true` — worker MUSI mieć wyjście na świat, żeby
    # sklonować repozytorium i zawołać model. Izolacja polega na tym, że ta
    # sieć nie zawiera bazy ani Redisa, a nie na odcięciu internetu.
    internal: false

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
  code-worker-work:
