# Infrastruktura TIKBENGOS — środowisko produkcyjne.
#
# Pięć różnic wobec `docker-compose.yml`, każda jest celowa:
#
# 1. HASA WYMAGANE, NIE DOMYŚLNE. W pliku developerskim hasło bazy ma
#    domyślkę `change-me`. Tu nie ma żadnej: brak zmiennej w `.env`
#    zatrzymuje start z błędem. Domyślka na publicznej maszynie to baza
#    otwarta dla każdego, kto zgadnie port.
# 2. PORTY NA ZEWNĄTRZ ZAMKNIĘTE. Baza, Redis, API i workery nie są
#    wystawione na świat — tylko reverse proxy (Caddy) ma porty 80 i 443.
#    Reszta rozmawia w sieci Dockera, gdzie nie dosięgnie jej nikt z zewnątrz.
# 3. SERWER PRODUKCYJNY, NIE DEVELOPERSKI. `runserver` i `daphne` są
#    zastąpione przez gunicorn (WSGI) i uvicorn (ASGI) z kilkoma procesami.
# 4. USŁUGA `web`. W pliku developerskim jej nie było, więc pod adresem
#    publicznym widać było samo API, a nie aplikację.
# 5. USŁUGA `code-worker`. Agent kodujący żyje w OSOBNYM kontenerze, w innej
#    sieci niż baza — powód jest w komentarzu przy samej usłudze i jest
#    bezpieczeństwem, nie wygodą.
#
# ── UWAGA O PIERWSZEJ LINII TEGO PLIKU ──────────────────────────────────
# Ten plik zaczynał się kiedyś od tekstu:
#
#     successfully downloaded text file (SHA: a135699e…)# Infrastruktura…
#
# To komunikat narzędzia, które pobierało plik — wklejony przed komentarzem.
# Docker Compose czytał go jako klucz najwyższego poziomu i odrzucał cały
# plik komunikatem `additional properties … not allowed`, więc build nie
# startował w ogóle. Pierwsza linia MUSI zaczynać się od `#` albo od `name:`.

name: tikbengos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bez domyślnego hasła. `${VAR:?komunikat}` przerywa start, gdy brak.
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Ustaw REDIS_PASSWORD w .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    # Trzy procesy gunicorna. Maszyna darmowa ma dwa rdzenie Ampere,
    # więc więcej procesów nie przyspieszy niczego — będzie tylko kolejkować.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn tikbengos.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY w .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Ustaw FIELD_ENCRYPTION_KEY w .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Ustaw ALLOWED_HOSTS w .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Ustaw CSRF_TRUSTED_ORIGINS w .env}
      # ── Moduły i dostawcy ─────────────────────────────────────────────
      # Compose NIE wstrzykuje zmiennych z `.env` do kontenerów sam z siebie:
      # `.env` służy tylko do podstawień `${...}` w tym pliku.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BENGOS_CODE_EXECUTOR_URL: ${BENGOS_CODE_EXECUTOR_URL:-}
      MUSICGEN_ENDPOINT: ${MUSICGEN_ENDPOINT:-}
      MUSIC_DAILY_LIMIT: ${MUSIC_DAILY_LIMIT:-10}
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:-}
      # ── Asystent: Ollama jako silnik modelu ──────────────────────────
      # Adres usługi `ollama` w sieci Dockera. API wysyła tu ZLECENIE,
      # a nie pytanie — model odpowiada na endpoint zwrotny, więc żądanie
      # API nie czeka na generację. Pusto = pytanie dostaje 503 z wyjaśnieniem.
      ASSISTANT_LLM_ENDPOINT: ${ASSISTANT_LLM_ENDPOINT:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    volumes:
      - api-media:/srv/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    restart: unless-stopped
    command: uvicorn tikbengos.asgi:application --host 0.0.0.0 --port 8001 --workers 2
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
      NODE_ENV: production
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Ustaw DOMAIN w .env}
      ACME_EMAIL: ${ACME_EMAIL:?Ustaw ACME_EMAIL w .env}
    depends_on:
      - web
      - api

  # ───────────────────────────────────────────────────────────────────────
  # MODEL ASYSTENTA — Ollama
  # ───────────────────────────────────────────────────────────────────────
  #
  # ── DLACZEGO WŁASNA USŁUGA, A NIE KLUCZ DOSTAWCY ───────────────────────
  # Model chodzi na tej samej maszynie co reszta stosu, więc nie ma klucza,
  # który mógłby wyciec, nie ma kosztu za token i nie ma drugiej tożsamości:
  # użytkownik nie zakłada konta u nikogo, żeby asystent odpowiedział.
  # Zostaje jedna tożsamość BENGOS z briefu.
  #
  # ── DLACZEGO BEZ `ports` ───────────────────────────────────────────────
  # Ollama domyślnie nie ma uwierzytelniania. Wystawiona na świat byłaby
  # otwartym modelem dla każdego, kto zgadnie adres — więc portu nie ma,
  # a dostęp ma wyłącznie sieć Dockera. To ta sama zasada co przy bazie.
  #
  # ── GDY MODEL NIE JEST POBRANY ─────────────────────────────────────────
  # Obraz startuje z pustym wolumenem. Workera nie obchodzi, jaki model
  # chcesz — bierze nazwę z `ASSISTANT_MODEL` i odmawia pracy, gdy go nie ma.
  # Pobranie należy do właściciela maszyny, bo to gigabajty i decyzja:
  #     docker compose --env-file .env -f infra/docker-compose.prod.yml \
  #       exec ollama ollama pull qwen2.5:7b
  # Wariant 7b to rozsądny kompromis na ARM z 24 GB: mieści się w pamięci
  # i odpowiada w kilka sekund. Większy model zje cały RAM maszyny.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────
  # WORKER ASYSTENTA — warstwa między API a Ollamą
  # ───────────────────────────────────────────────────────────────────────
  #
  # ── PO CO OSOBNY KONTENER, SKORO MODEL JEST OBOK ───────────────────────
  # API nie ma wag modelu i nie udaje, że ma: `services/api/ai/api.py`
  # tworzy zadanie i zwraca 202, a odpowiedź POWSTAJE tylko na endpoincie
  # zwrotnym. Ten kontener jest tym, co między jedno a drugie wchodzi —
  # z jednolitym raportem `running`/`succeeded`/`failed`.
  #
  # ── PROFIL `worker`, JAK PRZY AGENCIE KODUJĄCYM ────────────────────────
  # Usługa nie startuje przy zwykłym `up -d`, bo bez pobranego modelu nie
  # ma czego robić, a kontener, który stoi i nic nie robi, wygląda na
  # zepsuty. Włącza się świadomie — patrz komenda `ollama pull` wyżej:
  #     docker compose --profile worker up -d ai-worker
  #
  # ── `depends_on` Z `service_healthy`, NIE SAMO `depends_on` ───────────
  # Bez warunku kontener wstaje zanim Ollama zacznie słuchać i pierwsze
  # pytanie kończy się „connection refused”. Warunek to jedyne miejsce,
  # w którym ta kolejność jest zapisana.
  ai-worker:
    build:
      context: ..
      dockerfile: services/ai-worker/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    environment:
      # Adres modelu w sieci Dockera — nie publiczny, nie z `.env`,
      # bo ten kontener nie ma prawa wyjść na świat poza tym adresem.
      OLLAMA_URL: http://ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:?Ustaw ASSISTANT_MODEL w .env}
      API_INTERNAL_URL: http://api:8000
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:?Ustaw BENGOS_WORKER_TOKEN w .env}
      # Model bez limitu potrafi myśleć w nieskończoność. Ten limit jest
      # w kodzie workera; zostaje tu jako jawny ślad, że jest.
      PYTHONUNBUFFERED: "1"
    volumes:
      # Kod z hosta, żeby poprawka działała bez przebudowy obrazu.
      # `:ro` — worker nie pisze niczego do swojego kodu.
      - ../services/ai-worker:/srv:ro
    depends_on:
      ollama:
        condition: service_healthy
      api:
        condition: service_started

  # ───────────────────────────────────────────────────────────────────────
  # AGENT KODUJĄCY — BENGOS Dev
  # ───────────────────────────────────────────────────────────────────────
  # Agent wykonuje polecenia powłoki, więc żyje w OSOBNYM kontenerze,
  # w innej sieci niż baza. Powód jest bezpieczeństwem, nie wygodą —
  # szczegóły w komentarzach przy usłudze i w `services/code-worker/`.
  code-worker:
    build:
      context: ..
      dockerfile: services/code-worker/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CODE_AGENT_AVAILABLE: ${CODE_AGENT_AVAILABLE:-0}
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-}
      CODE_WORK_DIR: /srv/work
    volumes:
      - code-worker-work:/srv/work
    networks:
      - code-worker-net

networks:
  code-worker-net:
    driver: bridge
    internal: false

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
  code-worker-work:
  api-media:
  # Modele Ollamy — dziesiątki gigabajtów, więc MUSZĄ przeżyć przebudowę
  # obrazu i `up -d --build`. Bez tego wolumenu każde wdrożenie kasowałoby
  # pobrane modele i worker odmawiałby pracy do czasu ponownego pobrania.
  ollama-models:
