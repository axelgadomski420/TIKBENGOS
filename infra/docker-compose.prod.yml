name: tikbengos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Ustaw REDIS_PASSWORD w .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-worker:
    build:
      context: ..
      dockerfile: services/ai-worker/Dockerfile
    restart: unless-stopped
    environment:
      BENGOS_API_URL: http://api:8000
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:?Ustaw BENGOS_WORKER_TOKEN w .env}
      PLUTER_API_BASE_URL: ${PLUTER_API_BASE_URL:-https://api.openai.com/v1}
      PLUTER_API_KEY: ${PLUTER_API_KEY:-}
      PLUTER_MODEL: ${PLUTER_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn tikbengos.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY w .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Ustaw FIELD_ENCRYPTION_KEY w .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Ustaw ALLOWED_HOSTS w .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Ustaw CSRF_TRUSTED_ORIGINS w .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BENGOS_CODE_EXECUTOR_URL: ${BENGOS_CODE_EXECUTOR_URL:-}
      MUSICGEN_ENDPOINT: ${MUSICGEN_ENDPOINT:-}
      MUSIC_DAILY_LIMIT: ${MUSIC_DAILY_LIMIT:-10}
      BENGOS_WORKER_TOKEN: ${BENGOS_WORKER_TOKEN:?Ustaw BENGOS_WORKER_TOKEN w .env}
      ASSISTANT_LLM_ENDPOINT: http://ai-worker:8092/jobs
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    volumes:
      - api-media:/srv/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    restart: unless-stopped
    command: uvicorn tikbengos.asgi:application --host 0.0.0.0 --port 8001 --workers 2
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
      NODE_ENV: production
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Ustaw DOMAIN w .env}
      ACME_EMAIL: ${ACME_EMAIL:?Ustaw ACME_EMAIL w .env}
    depends_on:
      - web
      - api

  code-worker:
    build:
      context: ..
      dockerfile: services/code-worker/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CODE_AGENT_AVAILABLE: ${CODE_AGENT_AVAILABLE:-0}
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-}
      CODE_WORK_DIR: /srv/work
    volumes:
      - code-worker-work:/srv/work
    networks:
      - code-worker-net

networks:
  code-worker-net:
    driver: bridge
    internal: false

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
  code-worker-work:
  api-media:
